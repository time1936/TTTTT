<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daisyn · 个人成长工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;}
  .fade-in{animation:fin .45s ease both}
  @keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .flower{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:60;animation:drop 2.8s ease-in forwards}
  @keyframes drop{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(320deg);opacity:.7}}
  .pill{border-radius:9999px}
  input[type=date]{color-scheme:light}
  .tab-active{font-weight:600}
  ::selection{background:#2A9D8F;color:#fff}
</style>
</head>
<body class="min-h-screen antialiased" style="background:#FAFAFA;color:#2D3436">

<!-- ==================== 顶部导航 ==================== -->
<nav class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b" style="border-color:#EAECEF">
  <div class="max-w-6xl mx-auto px-5 h-14 flex items-center gap-1 overflow-x-auto">
    <span class="font-bold text-lg mr-3 shrink-0" style="color:#2A9D8F">Daisyn</span>
    <button data-tab="ideas"  class="tab px-3.5 py-1.5 pill text-sm whitespace-nowrap transition-colors">原子想法</button>
    <button data-tab="weekly" class="tab px-3.5 py-1.5 pill text-sm whitespace-nowrap transition-colors">周总结</button>
    <button data-tab="plans"  class="tab px-3.5 py-1.5 pill text-sm whitespace-nowrap transition-colors">未来规划</button>
    <button data-tab="skills" class="tab px-3.5 py-1.5 pill text-sm whitespace-nowrap transition-colors">技能增长</button>
    <button data-tab="daily"  class="tab px-3.5 py-1.5 pill text-sm whitespace-nowrap transition-colors">每日打卡</button>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-5 py-8">

<!-- ==================== 模块一：原子想法（Notion 柔和色块） ==================== -->
<section id="m-ideas" class="module fade-in" style="background:#F7F9FC;color:#2C3E50;border-radius:8px" hidden>
  <div class="p-6 md:p-8">
    <div class="flex items-baseline justify-between mb-1">
      <h2 class="text-lg font-semibold tracking-wide">原子想法</h2>
      <span class="text-xs" style="color:#2C3E50;opacity:.5">一个想法 = 一条记录</span>
    </div>
    <hr class="my-4" style="border:none;border-top:1px solid #E3E8EF">
    <div class="flex gap-2 mb-6">
      <input id="ideaInput" placeholder="记下一个想法……" class="flex-1 px-4 py-2.5 text-sm outline-none" style="background:#fff;border:1px solid #E3E8EF;border-radius:8px">
      <button id="ideaAdd" class="px-5 py-2.5 text-sm text-white" style="background:#9B59B6;border-radius:8px">记下</button>
    </div>
    <div id="ideaList" class="space-y-3"></div>
  </div>
</section>

<!-- ==================== 模块二：周总结（柔和多巴胺） ==================== -->
<section id="m-weekly" class="module fade-in" style="background:#F5F5F5;color:#2D3436;border-radius:16px" hidden>
  <div class="p-6 md:p-8">
    <h2 class="text-lg font-semibold mb-1">周总结</h2>
    <p class="text-xs mb-6" style="opacity:.55">每周一次，诚实作答。选择一个回答，或有话直讲。</p>
    <div id="weeklyQs" class="space-y-4"></div>
    <div class="mt-6 flex justify-end">
      <button id="weeklySave" class="pill px-6 py-2.5 text-sm text-white font-medium" style="background:#8A2BE2">保存本周总结</button>
    </div>
    <div class="mt-8">
      <h3 class="text-sm font-semibold mb-3" style="opacity:.7">往期回顾</h3>
      <div id="weeklyHistory" class="space-y-3"></div>
    </div>
  </div>
</section>

<!-- ==================== 模块三：未来规划（Apple Watch 风） ==================== -->
<section id="m-plans" class="module fade-in" style="background:#FAFAFA;color:#2D3436;border-radius:24px" hidden>
  <div class="p-6 md:p-8">
    <div class="p-4 mb-6 text-sm leading-relaxed" style="background:rgba(255,107,157,.12);border-radius:16px;border-left:4px solid #FF6B9D">
      请确保自己完全充分理智的结合现实情况与自身考虑过后，再填写长期目标。
    </div>

    <div id="plansMain">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">未来规划</h2>
        <button id="plansStatsBtn" class="pill px-4 py-2 text-xs" style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)">📊 统计视图（右滑）</button>
      </div>
      <div class="flex flex-col items-center justify-center py-10 mb-6" style="background:#fff;border-radius:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
        <button id="planAdd" class="w-20 h-20 text-4xl flex items-center justify-center" style="background:#4ECDC4;color:#fff;border-radius:9999px">＋</button>
        <p class="mt-3 text-sm font-medium">添加目标</p>
      </div>
      <div id="planList" class="space-y-4"></div>
    </div>

    <div id="plansStats" class="hidden">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold">目标完成情况</h2>
        <button id="plansBackBtn" class="pill px-4 py-2 text-xs" style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)">← 返回目标列表</button>
      </div>
      <div class="p-6 flex flex-col sm:flex-row items-center gap-8" style="background:#fff;border-radius:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
        <div class="relative w-44 h-44 shrink-0">
          <div id="donut" class="w-full h-full" style="border-radius:9999px"></div>
          <div class="absolute inset-4 bg-white flex flex-col items-center justify-center" style="border-radius:9999px">
            <span id="donutDone" class="text-2xl font-bold">0</span>
            <span class="text-[10px]" style="opacity:.55">本月完成</span>
          </div>
        </div>
        <div id="donutLegend" class="flex-1 space-y-2 text-sm w-full"></div>
      </div>
      <p class="mt-3 text-xs text-center" style="opacity:.5">记录周期：一个月一记</p>
    </div>
  </div>
</section>

<!-- ==================== 模块四：技能增长（Muji 柔和 + 修仙奖池） ==================== -->
<section id="m-skills" class="module fade-in" style="background:#F8F9FA;color:#343A40;border-radius:16px" hidden>
  <div class="p-6 md:p-8">
    <h2 class="text-lg font-semibold mb-1">技能增长</h2>
    <p class="text-xs mb-6" style="opacity:.55">勾选 = 修为到手，奖励从对应奖池掉落。</p>

    <div class="grid md:grid-cols-2 gap-5">
      <div class="p-5" style="background:#fff;border-radius:16px">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-sm" style="color:#2A9D8F">想要的技能</h3>
          <button id="skillAdd" class="pill px-3.5 py-1.5 text-xs text-white" style="background:#F4A261">＋ 添加</button>
        </div>
        <div class="flex gap-2 mb-4">
          <input id="skillInput" placeholder="技能名，如：爬虫" class="flex-1 px-3.5 py-2 text-sm outline-none" style="background:#F8F9FA;border-radius:12px">
        </div>
        <div id="skillWanted" class="space-y-2.5"></div>
      </div>
      <div class="p-5" style="background:#fff;border-radius:16px">
        <h3 class="font-semibold text-sm mb-4" style="color:#E76F51">拥有的技能</h3>
        <div id="skillOwned" class="space-y-2.5"></div>
      </div>
    </div>

    <h3 class="font-semibold text-sm mt-10 mb-4">奖池</h3>
    <div id="poolList" class="space-y-4"></div>
  </div>
</section>

<!-- ==================== 模块五：每日打卡（Airbnb 风） ==================== -->
<section id="m-daily" class="module fade-in" style="background:#FFFFFF;color:#484848;border-radius:16px" hidden>
  <div class="p-6 md:p-8 border" style="border-color:#EBEBEB;border-radius:16px">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h2 class="text-lg font-semibold">每日打卡</h2>
        <p id="dailyDate" class="text-xs" style="color:#767676"></p>
      </div>
      <div class="flex gap-2">
        <button id="dailyAddBtn" class="pill px-4 py-2 text-sm text-white shadow-sm" style="background:#FF5A5F">＋ 今日任务</button>
        <button id="taskSetBtn" class="pill px-4 py-2 text-sm shadow-sm" style="background:#fff;border:1px solid #FF5A5F;color:#FF5A5F">任务集</button>
        <button id="dailyStatsBtn" class="pill px-4 py-2 text-sm shadow-sm" style="background:#fff;border:1px solid #00A699;color:#00A699">统计（右滑）</button>
      </div>
    </div>

    <div id="dailyMain">
      <div id="dailyList" class="space-y-3"></div>
      <p id="dailyHint" class="mt-4 text-xs" style="color:#767676"></p>
    </div>

    <div id="dailyStats" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-sm">完成次数</h3>
        <button id="dailyBackBtn" class="pill px-4 py-1.5 text-xs" style="background:#fff;border:1px solid #00A699;color:#00A699">← 返回今日</button>
      </div>
      <div id="countList" class="space-y-3"></div>
    </div>
  </div>
</section>

</main>

<!-- ==================== 通用弹窗 ==================== -->
<div id="modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4" style="background:rgba(20,20,20,.35)">
  <div id="modalBox" class="bg-white w-full max-w-md p-6 fade-in" style="border-radius:20px"></div>
</div>

<script>
/* ============ 存储 ============ */
const KEY='daisyn_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function defDB(){return{ideas:[],weekly:[],plans:[],skills:{wanted:[],owned:[]},
 pools:{special:[],p1:[],p2:[],p3:[],p4:[]},taskSets:[],counts:{},
 daily:{date:todayStr(),tasks:[]}};}
let DB;try{DB=Object.assign(defDB(),JSON.parse(localStorage.getItem(KEY))||{});}catch(e){DB=defDB();}
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ 弹窗 ============ */
const modal=document.getElementById('modal'),mbox=document.getElementById('modalBox');
function openModal(html){mbox.innerHTML=html;modal.classList.remove('hidden');modal.classList.add('flex');}
function closeModal(){modal.classList.add('hidden');modal.classList.remove('flex');}
modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))closeModal();});

/* ============ 导航 ============ */
const TABS={ideas:'#9B59B6',weekly:'#8A2BE2',plans:'#4ECDC4',skills:'#F4A261',daily:'#FF5A5F'};
const NAVBG={ideas:'#F7F9FC',weekly:'#F5F5F5',plans:'#FAFAFA',skills:'#F8F9FA',daily:'#FFFFFF'};
let curTab='ideas';
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.module').forEach(m=>m.hidden=true);
  document.getElementById('m-'+t).hidden=false;
  document.body.style.background=NAVBG[t];
  document.querySelectorAll('.tab').forEach(b=>{
    const on=b.dataset.tab===t;
    b.classList.toggle('tab-active',on);
    b.style.background=on?TABS[t]:'transparent';
    b.style.color=on?'#fff':'#555';
  });
  ({ideas:renderIdeas,weekly:renderWeekly,plans:renderPlans,skills:renderSkills,daily:renderDaily})[t]();
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

/* ============ 模块一：原子想法 ============ */
const IDEA_COLORS=['#9B59B6','#1ABC9C','#F39C12','#E74C3C','#3498DB'];
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function renderIdeas(){
  const box=document.getElementById('ideaList');
  if(!DB.ideas.length){box.innerHTML='<p class="text-sm py-8 text-center" style="color:#2C3E50;opacity:.4">还没有想法，先记一个。</p>';return;}
  box.innerHTML=DB.ideas.slice().reverse().map((it,i)=>{
    const c=IDEA_COLORS[i%IDEA_COLORS.length];
    return `<div class="flex items-start gap-3 p-4" style="background:#fff;border-radius:8px;border:1px solid #EDF0F4">
      <span class="mt-0.5 w-2 h-2 shrink-0" style="background:${c};border-radius:2px"></span>
      <div class="flex-1 min-w-0">
        <p class="text-sm leading-relaxed break-words">${esc(it.text)}</p>
        <p class="text-[11px] mt-1.5" style="color:#2C3E50;opacity:.4">${it.ts}</p>
      </div>
      <button data-del-idea="${it.id}" class="text-xs shrink-0 hover:opacity-100" style="color:#2C3E50;opacity:.3">删除</button>
    </div>`;}).join('');
}
document.getElementById('ideaAdd').addEventListener('click',addIdea);
document.getElementById('ideaInput').addEventListener('keydown',e=>{if(e.key==='Enter')addIdea();});
function addIdea(){
  const inp=document.getElementById('ideaInput'),v=inp.value.trim();
  if(!v)return;
  DB.ideas.push({id:uid(),text:v,ts:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});
  inp.value='';save();renderIdeas();
}
document.getElementById('ideaList').addEventListener('click',e=>{
  const b=e.target.closest('[data-del-idea]');if(!b)return;
  DB.ideas=DB.ideas.filter(x=>x.id!==b.dataset.delIdea);save();renderIdeas();
});

/* ============ 模块二：周总结 ============ */
const WQ=[
 '本周有没有获得实际性提升的能力？如果有的话，知识性内容归档了吗？',
 '本周有哪些人际关系发生了对自己有影响的变化？本周自己的计划清单有没有完成 80% 以上？如果没有，请客观填写原因。',
 '本周自己有哪些旧的认知被刷新了？'
];
const WOPT=[
 {t:'包的呀！',bg:'rgba(50,205,50,.14)',c:'#1F8B1F',bd:'#32CD32'},
 {t:'并没有！',bg:'rgba(252,15,192,.10)',c:'#C2139B',bd:'#FC0FC0'},
 {t:'我有话讲......',bg:'rgba(0,255,255,.12)',c:'#0A7C7C',bd:'#00C8C8'}
];
const weeklyChoice=[null,null,null];
function renderWeekly(){
  const box=document.getElementById('weeklyQs');
  box.innerHTML=WQ.map((q,i)=>`
   <div class="p-5" style="background:#fff;border-radius:16px;border-top:4px solid ${['#FC0FC0','#00FFFF','#8A2BE2'][i]}">
     <p class="text-sm font-medium leading-relaxed mb-3">${i+1}. ${q}</p>
     <div class="flex flex-wrap gap-2 mb-2" data-qgroup="${i}">
       ${WOPT.map((o,j)=>`<button data-q="${i}" data-o="${j}" class="pill px-4 py-1.5 text-xs transition-all" style="background:${o.bg};color:${o.c};border:1.5px solid ${o.bd}">${o.t}</button>`).join('')}
     </div>
     <textarea data-wtext="${i}" placeholder="有话请讲……" class="w-full px-3.5 py-2 text-xs outline-none hidden" style="background:#F5F5F5;border-radius:12px;min-height:64px"></textarea>
   </div>`).join('');
  box.addEventListener('click',e=>{
    const b=e.target.closest('[data-q]');if(!b)return;
    const qi=+b.dataset.q,oi=+b.dataset.o;
    weeklyChoice[qi]=oi;
    b.parentElement.querySelectorAll('button').forEach(x=>{x.style.fontWeight='400';x.style.transform='none';});
    b.style.fontWeight='600';b.style.transform='scale(1.04)';
    const ta=document.querySelector(`[data-wtext="${qi}"]`);
    ta.classList.toggle('hidden',oi!==2);
  });
  renderWeeklyHistory();
}
function renderWeeklyHistory(){
  const box=document.getElementById('weeklyHistory');
  if(!DB.weekly.length){box.innerHTML='<p class="text-xs py-4" style="opacity:.4">还没有记录。</p>';return;}
  box.innerHTML=DB.weekly.slice().reverse().map(w=>`
   <div class="p-4" style="background:#fff;border-radius:16px">
     <p class="text-xs font-semibold mb-2" style="color:#8A2BE2">${w.date}</p>
     ${w.answers.map((a,i)=>`<div class="text-xs mb-1.5 leading-relaxed"><span style="opacity:.45">Q${i+1}</span> <b>${WOPT[a.choice].t}</b>${a.text?`<span style="opacity:.7"> —— ${esc(a.text)}</span>`:''}</div>`).join('')}
   </div>`).join('');
}
document.getElementById('weeklySave').addEventListener('click',()=>{
  if(weeklyChoice.some(c=>c===null)){openModal(`<p class="text-sm mb-4">三个问题都选一下再保存哦。</p><button data-close class="pill px-4 py-2 text-xs text-white" style="background:#8A2BE2">好的</button>`);return;}
  const answers=weeklyChoice.map((c,i)=>{
    const ta=document.querySelector(`[data-wtext="${i}"]`);
    return {choice:c,text:c===2?ta.value.trim():''};
  });
  DB.weekly.push({id:uid(),date:new Date().toLocaleDateString('zh-CN')+'（第 '+getWeekNum()+' 周）',answers});
  save();weeklyChoice.fill(null);renderWeekly();
  openModal(`<p class="text-sm mb-4">本周总结已归档，下周继续。</p><button data-close class="pill px-4 py-2 text-xs text-white" style="background:#8A2BE2">收到</button>`);
});
function getWeekNum(){const d=new Date();const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}

/* ============ 模块三：未来规划 ============ */
function renderPlans(){
  const box=document.getElementById('planList');
  const today=todayStr();
  if(!DB.plans.length){box.innerHTML='<p class="text-sm text-center py-6" style="opacity:.4">还没有目标。</p>';}
  else box.innerHTML=DB.plans.slice().reverse().map(p=>{
    const overdue=p.progress<100&&p.end<today;
    const c=p.progress>=100?'#6BCB77':overdue?'#FF6B9D':'#4ECDC4';
    return `<div class="p-5" style="background:#fff;border-radius:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div class="min-w-0">
          <h4 class="font-semibold text-sm break-words">${esc(p.name)}</h4>
          <p class="text-[11px] mt-1" style="opacity:.5">${p.start} → ${p.end} · ${p.type==='short'?'短期目标':'长期目标'}${overdue?' · <span style="color:#FF6B9D">已逾期</span>':p.progress>=100?' · <span style="color:#6BCB77">已完成 🎉</span>':''}</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span class="text-xl font-bold tabular-nums" style="color:${c}">${p.progress}<span class="text-xs">%</span></span>
          <button data-del-plan="${p.id}" class="text-xs" style="opacity:.3">✕</button>
        </div>
      </div>
      <div style="height:8px;background:#F0F1F3;border-radius:9999px;overflow:hidden">
        <div style="height:100%;width:${p.progress}%;background:${c};border-radius:9999px;transition:width .5s"></div>
      </div>
      <p class="text-[10px] mt-2" style="opacity:.45">与「每日打卡」同名任务打卡一次 +10%</p>
    </div>`;}).join('');
  renderDonut();
}
function progressPlan(name){
  let hit=false;
  DB.plans.forEach(p=>{if(p.name===name&&p.progress<100){p.progress=Math.min(100,p.progress+10);hit=true;
    if(p.progress===100)p.completedAt=todayStr();}});
  if(hit){save();if(curTab==='plans')renderPlans();}
  return hit;
}
function renderDonut(){
  const today=todayStr(),month=today.slice(0,7);
  const done=DB.plans.filter(p=>p.progress>=100&&(p.completedAt||'').startsWith(month)).length;
  const act=DB.plans.filter(p=>p.progress<100&&p.end>=today).length;
  const over=DB.plans.filter(p=>p.progress<100&&p.end<today).length;
  const tot=done+act+over;
  const d=document.getElementById('donut');
  if(!tot){d.style.background='#F0F1F3';}
  else{
    const seg=[[done,'#6BCB77'],[act,'#4ECDC4'],[over,'#FF6B9D']];
    let acc=0,parts=[];
    seg.forEach(([n,c])=>{if(!n)return;const a=acc/tot*100,b=(acc+n)/tot*100;parts.push(`${c} ${a.toFixed(1)}% ${b.toFixed(1)}%`);acc+=n;});
    d.style.background=`conic-gradient(${parts.join(',')})`;
  }
  document.getElementById('donutDone').textContent=done;
  document.getElementById('donutLegend').innerHTML=`
    ${[['已完成','#6BCB77',done],['进行中','#4ECDC4',act],['已逾期','#FF6B9D',over]].map(([l,c,n])=>`
      <div class="flex items-center gap-2"><span class="w-3 h-3" style="background:${c};border-radius:4px"></span><span class="flex-1">${l}</span><b class="tabular-nums">${n}</b></div>`).join('')}
    <p class="text-xs pt-2" style="opacity:.5">统计周期：${month}（自然月）</p>`;
}
document.getElementById('plansStatsBtn').addEventListener('click',()=>{document.getElementById('plansMain').classList.add('hidden');document.getElementById('plansStats').classList.remove('hidden');renderDonut();});
document.getElementById('plansBackBtn').addEventListener('click',()=>{document.getElementById('plansStats').classList.add('hidden');document.getElementById('plansMain').classList.remove('hidden');});

document.getElementById('planAdd').addEventListener('click',()=>{
  openModal(`
   <h3 class="font-semibold mb-4 text-sm">添加什么类型的目标？</h3>
   <div class="grid grid-cols-2 gap-3">
     <button data-ptype="short" class="p-5 text-left" style="background:rgba(78,205,196,.12);border-radius:16px"><b class="text-sm">短期目标</b><p class="text-[11px] mt-1" style="opacity:.6">时长 ≤ 3 个月</p></button>
     <button data-ptype="long" class="p-5 text-left" style="background:rgba(255,107,157,.12);border-radius:16px"><b class="text-sm">长期目标</b><p class="text-[11px] mt-1" style="opacity:.6">时长 ≥ 3 个月，上不封顶</p></button>
   </div>
   <button data-close class="mt-4 text-xs" style="opacity:.4">取消</button>`);
});
document.getElementById('modalBox').addEventListener('click',e=>{
  const b=e.target.closest('[data-ptype]');if(!b)return;
  const type=b.dataset.ptype;
  openModal(`
   <h3 class="font-semibold mb-4 text-sm">${type==='short'?'短期目标':'长期目标'}</h3>
   <input id="goalName" placeholder="目标名称（与每日打卡任务同名可联动进度）" class="w-full px-3.5 py-2.5 text-sm outline-none mb-3" style="background:#F6F7F8;border-radius:12px">
   <div class="grid grid-cols-2 gap-3 mb-4">
     <div><label class="text-xs block mb-1" style="opacity:.6">开始日期</label><input id="goalStart" type="date" value="${todayStr()}" class="w-full px-3 py-2 text-sm outline-none" style="background:#F6F7F8;border-radius:12px"></div>
     <div><label class="text-xs block mb-1" style="opacity:.6">结束日期</label><input id="goalEnd" type="date" class="w-full px-3 py-2 text-sm outline-none" style="background:#F6F7F8;border-radius:12px"></div>
   </div>
   <p id="goalErr" class="text-xs mb-3 hidden" style="color:#E74C3C"></p>
   <div class="flex gap-2 justify-end">
     <button data-close class="pill px-4 py-2 text-xs" style="background:#F0F1F3">取消</button>
     <button id="goalOk" class="pill px-5 py-2 text-xs text-white" style="background:#4ECDC4">确定</button>
   </div>`);
  document.getElementById('goalOk').addEventListener('click',()=>{
    const name=document.getElementById('goalName').value.trim();
    const s=document.getElementById('goalStart').value,t=document.getElementById('goalEnd').value;
    const err=document.getElementById('goalErr');
    if(!name||!s||!t){err.textContent='名称和起止日期都要填。';err.classList.remove('hidden');return;}
    const days=(new Date(t)-new Date(s))/86400000;
    if(days<1){err.textContent='结束日期要晚于开始日期。';err.classList.remove('hidden');return;}
    if(type==='short'&&days>92){err.textContent='短期目标时长不能超过三个月（约 92 天），当前 '+days+' 天。';err.classList.remove('hidden');return;}
    if(type==='long'&&days<92){err.textContent='长期目标时长不得少于三个月（约 92 天），当前 '+days+' 天。';err.classList.remove('hidden');return;}
    DB.plans.push({id:uid(),name,type,start:s,end:t,progress:0,completedAt:null});
    save();closeModal();switchTab('plans');
  });
});

/* ============ 模块四：技能增长 ============ */
const DIFF=[
 {key:'筑基',pool:'p4',color:'#F5B7B1',poolName:'四级奖池'},
 {key:'金丹',pool:'p3',color:'#EC7063',poolName:'三级奖池'},
 {key:'元婴',pool:'p2',color:'#E74C3C',poolName:'二级奖池'},
 {key:'化神',pool:'p1',color:'#CB4335',poolName:'一级奖池'},
 {key:'越级挑战',pool:'special',color:'#922B21',poolName:'特级奖池'}
];
function renderSkills(){
  const w=document.getElementById('skillWanted');
  w.innerHTML=DB.skills.wanted.length?DB.skills.wanted.map(s=>{
    const d=DIFF.find(x=>x.key===s.diff);
    return `<label class="flex items-center gap-3 p-3 cursor-pointer" style="background:#F8F9FA;border-radius:12px">
      <input type="checkbox" data-skill-check="${s.id}" class="w-4 h-4 accent-[#2A9D8F]">
      <span class="flex-1 text-sm">${esc(s.name)}</span>
      <span class="text-[10px] px-2 py-0.5" style="background:${d.color};color:#fff;border-radius:6px">${d.key}</span>
    </label>`;}).join('')
   :'<p class="text-xs py-3" style="opacity:.4">空空如也。</p>';
  const o=document.getElementById('skillOwned');
  o.innerHTML=DB.skills.owned.length?DB.skills.owned.map(s=>{
    const d=DIFF.find(x=>x.key===s.diff);
    return `<div class="flex items-center gap-3 p-3" style="background:#F8F9FA;border-radius:12px;${s.claimed?'filter:grayscale(.7);opacity:.75':''}">
      <span class="text-sm flex-1">${esc(s.name)}</span>
      <span class="text-[10px] px-2 py-0.5" style="background:${d.color};color:#fff;border-radius:6px">${d.key}</span>
      ${s.claimed?'<span class="text-[10px]" style="color:#2A9D8F">✓ 已领取</span>'
        :`<button data-claim="${s.id}" class="pill px-3 py-1 text-xs text-white" style="background:#E76F51">🎁 领取奖励</button>`}
    </div>`;}).join('')
   :'<p class="text-xs py-3" style="opacity:.4">修为尚浅，先去勾一个。</p>';
  renderPools();
}
function renderPools(){
  document.getElementById('poolList').innerHTML=DIFF.slice().reverse().map(d=>{
    const items=DB.pools[d.pool];
    return `<div class="p-5" style="background:#fff;border-radius:16px">
      <div class="flex items-center justify-between mb-3">
        <h4 class="text-sm font-semibold flex items-center gap-2"><span class="w-3 h-3" style="background:${d.color};border-radius:4px"></span>${d.poolName}<span class="text-[10px] font-normal" style="opacity:.5">${d.key}难度 · ${items.length} 件</span></h4>
        <button data-pool-add="${d.pool}" class="pill px-3.5 py-1.5 text-xs text-white" style="background:#2A9D8F">＋ 叠加奖池</button>
      </div>
      <div class="flex flex-wrap gap-2">
        ${items.length?items.map(it=>`
          <div class="flex items-center gap-2 px-3 py-2" style="background:#F8F9FA;border-radius:12px;${it.claimed?'filter:grayscale(1);opacity:.5':''}">
            ${it.img?`<img src="${it.img}" class="w-8 h-8 object-cover" style="border-radius:8px">`:`<span class="text-xs">${esc(it.name)}</span>`}
            ${it.claimed?'<span class="text-[9px]" style="color:#34495E">已领取</span>':''}
          </div>`).join(''):'<p class="text-xs" style="opacity:.35">奖池空空，先叠加点奖励吧。</p>'}
      </div>
    </div>`;}).join('');
}

       <span class="text-sm font-medium">${d.key}</span><span class="text-[10px] opacity-80">${['入门级','进阶级','高手级','大师级','地狱级'][i]} · ${d.poolName}</span></button>`).join('')}

document.getElementById('skillWanted').addEventListener('change',e=>{
  const cb=e.target.closest('[data-skill-check]');if(!cb||!cb.checked)return;
  const s=DB.skills.wanted.find(x=>x.id===cb.dataset.skillCheck);if(!s)return;
  DB.skills.wanted=DB.skills.wanted.filter(x=>x.id!==s.id);
  DB.skills.owned.push({...s,claimed:false});
  save();renderSkills();
  for(let i=0;i<6;i++)setTimeout(dropFlower,i*260);
});
function dropFlower(){
  const f=document.createElement('span');f.className='flower';f.textContent='🌸';
  f.style.left=(10+Math.random()*80)+'vw';
  document.body.appendChild(f);setTimeout(()=>f.remove(),3000);
}
document.getElementById('skillOwned').addEventListener('click',e=>{
  const b=e.target.closest('[data-claim]');if(!b)return;
  const s=DB.skills.owned.find(x=>x.id===b.dataset.claim);if(!s)return;
  const d=DIFF.find(x=>x.key===s.diff);
  const avail=DB.pools[d.pool].filter(it=>!it.claimed);
  if(!avail.length){
    openModal(`<p class="text-sm mb-4">「${d.poolName}」还是空的，先去叠加奖池，修为不等人。</p>
      <button data-close class="pill px-4 py-2 text-xs text-white" style="background:#2A9D8F">这就去</button>`);
    return;
  }
  const reward=avail[Math.floor(Math.random()*avail.length)];
  openModal(`
    <p class="text-xs mb-3" style="opacity:.55">「${esc(s.name)}」（${d.key}）触发 ${d.poolName}，掉落——</p>
    <div class="p-5 text-center" style="background:#F8F9FA;border-radius:16px">
      ${reward.img?`<img src="${reward.img}" class="max-h-36 mx-auto object-contain" style="border-radius:12px">`:`<p class="text-lg font-bold" style="color:#E76F51">${esc(reward.name)}</p>`}
    </div>
    <div class="flex justify-end gap-2 mt-4">
      <button data-close class="pill px-4 py-2 text-xs" style="background:#F0F1F3">先不领</button>
      <button id="claimOk" class="pill px-5 py-2 text-xs text-white" style="background:#2A9D8F">确认领取</button>
    </div>`);
  document.getElementById('claimOk').addEventListener('click',()=>{
    reward.claimed=true;s.claimed=true;
    save();closeModal();renderSkills();
  });
});
document.getElementById('poolList').addEventListener('click',e=>{
  const b=e.target.closest('[data-pool-add]');if(!b)return;
  const pool=b.dataset.poolAdd,d=DIFF.find(x=>x.pool===pool);
  openModal(`
   <h3 class="font-semibold mb-1 text-sm">叠加「${d.poolName}」</h3>
   <p class="text-xs mb-4" style="opacity:.5">写名字或上传实物图，数量不限。</p>
   <input id="rewardName" placeholder="奖励名称，如：一顿火锅" class="w-full px-3.5 py-2.5 text-sm outline-none mb-3" style="background:#F8F9FA;border-radius:12px">
   <div class="flex items-center gap-2 mb-4">
     <input id="rewardImg" type="file" accept="image/*" class="text-xs">
     <span id="imgName" class="text-xs" style="opacity:.5"></span>
   </div>
   <div class="flex justify-end gap-2">
     <button data-close class="pill px-4 py-2 text-xs" style="background:#F0F1F3">完成</button>
     <button id="rewardAdd" class="pill px-5 py-2 text-xs text-white" style="background:#F4A261">加入奖池</button>
   </div>`);
  let imgData=null;
  document.getElementById('rewardImg').addEventListener('change',ev=>{
    const f=ev.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{imgData=r.result;document.getElementById('imgName').textContent='已选：'+f.name;};
    r.readAsDataURL(f);
  });
  document.getElementById('rewardAdd').addEventListener('click',()=>{
    const name=document.getElementById('rewardName').value.trim();
    if(!name&&!imgData)return;
    DB.pools[pool].push({id:uid(),name:imgData?'':name,img:imgData,claimed:false});
    save();renderSkills();
    document.getElementById('rewardName').value='';imgData=null;
    document.getElementById('imgName').textContent='';
    openModalKeepPool(pool,d);
  });
  function openModalKeepPool(){/* modal stays open until 完成 */}
});

/* ============ 模块五：每日打卡 ============ */
const REASONS=[
 'A. 安排的不合理，精力分配不足',
 'B. 不得已的突发情况打乱了计划',
 'C. 就是纯懒',
 'D. 我在质疑这个任务的必要性之后觉得没必要做',
 'E. 现在不急，可以拖到明天'
];
function rolloverDaily(){
  if(DB.daily.date!==todayStr()){DB.daily={date:todayStr(),tasks:[]};save();}
}
function renderDaily(){
  rolloverDaily();
  const now=new Date(),late=now.getHours()>=23;
  document.getElementById('dailyDate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const box=document.getElementById('dailyList');
  if(!DB.daily.tasks.length){box.innerHTML='<p class="text-sm py-8 text-center" style="color:#767676;opacity:.6">今天还没有任务，加一个。</p>';}
  else box.innerHTML=DB.daily.tasks.map(t=>{
    const n=DB.counts[t.name]||0;
    return `<div class="flex items-center gap-3 p-4" style="background:#fff;border:1px solid #EBEBEB;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)">
      <button data-check="${t.id}" class="w-6 h-6 shrink-0 flex items-center justify-center transition-all" style="border:2px solid ${t.done?'#00A699':'#DCE0E3'};background:${t.done?'#00A699':'#fff'};border-radius:9999px">
        ${t.done?'<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" stroke="#fff" stroke-width="2"/></svg>':''}
      </button>
      <div class="flex-1 min-w-0">
        <p class="text-sm break-words" style="${t.done?'color:#B0BEC5;text-decoration:line-through':''}">${esc(t.name)}</p>
        ${n?`<p class="text-[10px] mt-0.5" style="color:#00A699">累计 ${n} 次</p>`:''}
      </div>
      ${!t.done&&late?`
        <select data-reason="${t.id}" class="text-[11px] px-2 py-1 shrink-0" style="border:1px solid #FC642D;border-radius:9999px;color:#FC642D;background:#fff">
          <option value="">未完成原因…</option>
          ${REASONS.map((r,i)=>`<option value="${i}" ${t.reason===i?'selected':''}>${r}</option>`).join('')}
        </select>`:''}
      <button data-del-task="${t.id}" class="text-xs shrink-0" style="opacity:.25">✕</button>
    </div>`;}).join('');
  document.getElementById('dailyHint').textContent=late?'已过 23:00，未勾选的任务记为未完成，请选择原因。':'23:00 后未勾选的任务将记为未完成。';
  renderCounts();
}
document.getElementById('dailyList').addEventListener('click',e=>{
  const c=e.target.closest('[data-check]');
  if(c){
    const t=DB.daily.tasks.find(x=>x.id===c.dataset.check);if(!t)return;
    t.done=!t.done;
    if(t.done){
      DB.counts[t.name]=(DB.counts[t.name]||0)+1;
      const linked=progressPlan(t.name);
      if(linked)toast(`「${t.name}」打卡成功，同名目标进度 +10%`);
    }
    save();renderDaily();return;
  }
  const d=e.target.closest('[data-del-task]');
  if(d){DB.daily.tasks=DB.daily.tasks.filter(x=>x.id!==d.dataset.delTask);save();renderDaily();}
});
document.getElementById('dailyList').addEventListener('change',e=>{
  const s=e.target.closest('[data-reason]');if(!s)return;
  const t=DB.daily.tasks.find(x=>x.id===s.dataset.reason);
  if(t){t.reason=s.value===''?null:+s.value;save();}
});
function renderCounts(){
  const box=document.getElementById('countList');
  const entries=Object.entries(DB.counts).sort((a,b)=>b[1]-a[1]);
  box.innerHTML=entries.length?entries.map(([n,c],i)=>`
    <div class="flex items-center gap-3 p-4" style="background:#fff;border:1px solid #EBEBEB;border-radius:12px">
      <span class="pill px-2.5 py-0.5 text-xs text-white" style="background:${['#FF5A5F','#00A699','#FC642D','#FFD54F','#B0BEC5'][i%5]}">${i+1}</span>
      <p class="flex-1 text-sm">这件事我已经做了 <b style="color:#00A699">${c}</b> 次</p>
      <span class="text-xs" style="color:#767676">${esc(n)}</span>
    </div>`).join('')
   :'<p class="text-sm py-6 text-center" style="color:#767676;opacity:.6">还没有累计记录。</p>';
}
document.getElementById('dailyStatsBtn').addEventListener('click',()=>{document.getElementById('dailyMain').classList.add('hidden');document.getElementById('dailyStats').classList.remove('hidden');renderCounts();});
document.getElementById('dailyBackBtn').addEventListener('click',()=>{document.getElementById('dailyStats').classList.add('hidden');document.getElementById('dailyMain').classList.remove('hidden');});
document.getElementById('dailyAddBtn').addEventListener('click',()=>{
  openModal(`
   <h3 class="font-semibold mb-4 text-sm">添加今日任务</h3>
   <input id="taskName" placeholder="任务名（与目标同名可联动进度）" class="w-full px-3.5 py-2.5 text-sm outline-none mb-3" style="background:#F7F7F7;border-radius:12px">
   ${DB.taskSets.length?`<p class="text-xs mb-2" style="color:#767676">从任务集批量添加：</p>
   <div class="space-y-2 mb-3">${DB.taskSets.map(s=>`<button data-set-add="${s.id}" class="w-full flex items-center justify-between px-3.5 py-2.5 text-sm" style="background:#FFF1F1;border-radius:12px"><span>${esc(s.name)}</span><span class="text-xs" style="color:#FF5A5F">${s.tasks.length} 项 ›</span></button>`).join('')}</div>`:''}
   <div class="flex justify-end gap-2">
     <button data-close class="pill px-4 py-2 text-xs" style="background:#F0F0F0">关闭</button>
     <button id="taskOk" class="pill px-5 py-2 text-xs text-white" style="background:#FF5A5F">添加</button>
   </div>`);
  document.getElementById('taskOk').addEventListener('click',()=>{
    const v=document.getElementById('taskName').value.trim();
    if(!v)return;
    if(DB.daily.tasks.some(t=>t.name===v))return;
    DB.daily.tasks.push({id:uid(),name:v,done:false,reason:null});

document.getElementById('modalBox').addEventListener('click',e=>{
  const b=e.target.closest('[data-set-add]');if(!b)return;
  const set=DB.taskSets.find(x=>x.id===b.dataset.setAdd);if(!set)return;
  let added=0;
  set.tasks.forEach(name=>{
    if(!DB.daily.tasks.some(t=>t.name===name)){DB.daily.tasks.push({id:uid(),name,done:false,reason:null});added++;}
  });
  save();closeModal();renderDaily();
  toast(`已从「${set.name}」批量添加 ${added} 个任务`);
});
document.getElementById('taskSetBtn').addEventListener('click',()=>{
  openModal(`
   <h3 class="font-semibold mb-4 text-sm">任务集</h3>
   <div class="flex gap-2 mb-4">
     <input id="setName" placeholder="新建任务集名称，如：晨间Routine" class="flex-1 px-3.5 py-2 text-sm outline-none" style="background:#F7F7F7;border-radius:12px">
     <button id="setCreate" class="pill px-4 py-2 text-xs text-white" style="background:#00A699">创建</button>
   </div>
   <div id="setList" class="space-y-3 max-h-72 overflow-auto"></div>
   <button data-close class="mt-4 text-xs w-full" style="color:#767676">关闭</button>`);
  renderSetList();
  document.getElementById('setCreate').addEventListener('click',()=>{
    const v=document.getElementById('setName').value.trim();if(!v)return;
    DB.taskSets.push({id:uid(),name:v,tasks:[]});
    document.getElementById('setName').value='';
    save();renderSetList();
  });
  function renderSetList(){
    const box=document.getElementById('setList');
    box.innerHTML=DB.taskSets.length?DB.taskSets.map(s=>`
      <div class="p-3.5" style="background:#F7F7F7;border-radius:12px">
        <div class="flex items-center justify-between mb-2">
          <b class="text-sm">${esc(s.name)}</b>
          <button data-set-del="${s.id}" class="text-xs" style="opacity:.3">✕</button>
        </div>
        <div class="flex flex-wrap gap-1.5 mb-2">
          ${s.tasks.map((t,i)=>`<span class="pill px-2.5 py-1 text-[11px]" style="background:#fff;border:1px solid #E0E0E0">${esc(t)} <button data-task-del="${s.id}:${i}" style="opacity:.4">✕</button></span>`).join('')||'<span class="text-xs" style="color:#767676;opacity:.6">空</span>'}
        </div>
        <div class="flex gap-2">
          <input data-set-task="${s.id}" placeholder="加一条任务" class="flex-1 px-3 py-1.5 text-xs outline-none" style="background:#fff;border-radius:9999px">
          <button data-set-task-add="${s.id}" class="pill px-3 py-1.5 text-xs text-white" style="background:#00A699">＋</button>
        </div>
      </div>`).join(''):'<p class="text-xs" style="color:#767676;opacity:.6">还没有任务集。</p>';
  }
  document.getElementById('setList').addEventListener('click',e=>{
    const add=e.target.closest('[data-set-task-add]');
    if(add){
      const s=DB.taskSets.find(x=>x.id===add.dataset.setTaskAdd);
      const inp=document.querySelector(`[data-set-task="${s.id}"]`);
      const v=inp.value.trim();if(!v||!s)return;
      s.tasks.push(v);save();renderSetList();return;
    }
    const td=e.target.closest('[data-task-del]');
    if(td){
      const [sid,i]=td.dataset.taskDel.split(':');
      const s=DB.taskSets.find(x=>x.id===sid);
      if(s){s.tasks.splice(+i,1);save();renderSetList();}
      return;
    }
    const del=e.target.closest('[data-set-del]');
    if(del){DB.taskSets=DB.taskSets.filter(x=>x.id!==del.dataset.setDel);save();renderSetList();}
  });
});

/* ============ Toast ============ */
let toastTimer=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#00A699;color:#fff;padding:10px 22px;border-radius:9999px;font-size:13px;z-index:70;transition:opacity .3s';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity='0',2400);
}

/* ============ 右滑手势（规划/打卡统计视图） ============ */
let tx0=null;
document.addEventListener('touchstart',e=>tx0=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  if(tx0===null)return;
  const dx=e.changedTouches[0].clientX-tx0;tx0=null;
  if(dx<-60){
    if(curTab==='plans'&&!document.getElementById('plansStats').classList.contains('hidden'))return;
    if(curTab==='plans')document.getElementById('plansStatsBtn').click();
    if(curTab==='daily')document.getElementById('dailyStatsBtn').click();
  }
}, {passive:true});

/* ============ 启动 ============ */
switchTab('ideas');
</script>
